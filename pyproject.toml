[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "target-aware-global-local-registration"
version = "0.1.0"
description = "Target-aware global-local infrared-visible image registration for small UAV targets"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.9"
dependencies = ["torch>=2.8,<2.9", "numpy==2.0.2", "opencv-python==4.13.0.90"]

[tool.setuptools.packages.find]
where = ["src"]
